name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify modules
        run: go mod verify

      - name: Build all packages and tools
        run: go build -v ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Run unit tests with Race Detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -v ./...

      - name: Verify ITU-T Conformance Vector (TEST.pst)
        run: go test -v -run TestDecoderOfficialTestVector .

      - name: Run RTF Benchmark Smoke Test
        run: go test -run=^$ -bench=BenchmarkRTF -benchtime=100ms .

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run go vet
        run: go vet ./...

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Fuzz Decoder (smoke)
        run: go test -fuzz=FuzzDecode -fuzztime=20s .

      - name: Fuzz Encoder (smoke)
        run: go test -fuzz=FuzzEncode -fuzztime=20s .

      - name: Fuzz RTP Unpack (smoke)
        run: go test -fuzz=FuzzUnpack -fuzztime=20s ./rtp/

      - name: Fuzz SDP Parsing (smoke)
        run: go test -fuzz=FuzzParseFMTPParams -fuzztime=20s ./sdp/
